name: Deploy migrations to shared Supabase project

# Manual only, on purpose: this deploys hotsflow-core/supabase/migrations/ —
# the single source of truth for the platform's shared database (Fase 2,
# Decision 4) — to the real hosted project. Never triggers automatically on
# push. `mode: check` is read-only (safe to run anytime); `mode: apply`
# requires typing the target project ref as an extra confirmation gate.
#
# migration_scope controls how out-of-order local migrations are handled.
# `standard` (default) is a plain `supabase migration up`, which the CLI
# itself refuses whenever a local migration's timestamp is older than the
# latest migration already recorded on the remote history table -- exactly
# what happened with 20260905134500_guest_requests_hotels_org_isolation.sql
# after 20260906072119/20260908112932/20260908114016 were reconciled to
# their real (later) production timestamps, and again with
# 20260915160000/20260915170000 after 20260915180000 (an unrelated,
# already-approved early-access migration) was applied first. `include-all`
# opts into applying those out-of-order migrations too, but only when every
# one of these holds: mode is apply, migration_scope is include-all,
# confirm_project_ref matches the configured project, AND
# confirm_out_of_order_version is typed exactly as the out-of-order
# migration(s) this gate currently allows (20260915160000,20260915170000).
# Before applying
# anything under include-all, a `supabase db push --dry-run` step prints
# what would run; `supabase migration up` itself has no dry-run flag, so
# this preview intentionally uses `db push` for that one read-only step
# while the actual apply below stays on `migration up`, matching the
# command the CLI's own error message named. A separate gate re-reads the
# pending set from the remote database right before any apply and refuses
# to proceed unless it is exactly the migration approved for this release
# -- no unexpected file can ever be picked up by an apply run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only migration list only; apply = push pending migrations"
        required: true
        type: choice
        options:
          - check
          - apply
        default: check
      migration_scope:
        description: "standard = ordinary `migration up` (refuses out-of-order migrations); include-all = also apply the currently-approved out-of-order migration(s) (requires confirm_out_of_order_version below). Ignored when mode is check."
        required: true
        type: choice
        options:
          - standard
          - include-all
        default: standard
      confirm_out_of_order_version:
        description: "Only checked when migration_scope is include-all: type the exact out-of-order migration version(s) being applied (must be 20260915160000,20260915170000). Any value is accepted for mode=check or migration_scope=standard."
        required: true
      confirm_project_ref:
        description: "Type the target Supabase project ref to confirm (must match the SUPABASE_PROJECT_REF repo variable exactly)"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target project ref matches expectation
        run: |
          if [ "${{ inputs.confirm_project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::confirm_project_ref ('${{ inputs.confirm_project_ref }}') does not match the configured SUPABASE_PROJECT_REF repo variable — refusing to proceed."
            exit 1
          fi
          echo "Target project ref confirmed: ${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Verify out-of-order confirmation (include-all only)
        if: inputs.mode == 'apply' && inputs.migration_scope == 'include-all'
        run: |
          if [ "${{ inputs.confirm_out_of_order_version }}" != "20260915160000,20260915170000" ]; then
            echo "::error::confirm_out_of_order_version ('${{ inputs.confirm_out_of_order_version }}') must be exactly 20260915160000,20260915170000 to apply with migration_scope=include-all — refusing to proceed."
            exit 1
          fi
          echo "Out-of-order confirmation matched: 20260915160000,20260915170000"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migration status (read-only, always runs)
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration list --db-url "$SUPABASE_DB_URL" | tee migration_list_before.txt

      - name: Verify pending migration set matches the approved migration exactly
        if: inputs.mode == 'apply'
        run: |
          pending=$(grep '`' migration_list_before.txt | while IFS='|' read -r local_col remote_col _rest; do
            local_val=$(echo "$local_col" | tr -d '`' | xargs)
            remote_val=$(echo "$remote_col" | tr -d '`' | xargs)
            if [ -n "$local_val" ] && [ -z "$remote_val" ]; then
              echo "$local_val"
            fi
          done | sort)
          expected=$(printf '%s\n' 20260916100000 20260916120000 20260916130000 | sort)
          echo "Pending (local-only) migrations:"
          echo "$pending"
          if [ "$pending" != "$expected" ]; then
            echo "::error::Pending migration set does not match exactly the approved set ($(echo "$expected" | tr '\n' ' ')) — refusing to apply anything."
            exit 1
          fi
          echo "Pending set confirmed: exactly the approved set ($(echo "$expected" | tr '\n' ' '))."

      - name: Preview include-all apply (dry run, no changes made)
        if: inputs.mode == 'apply' && inputs.migration_scope == 'include-all'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Apply pending migrations (standard)
        if: inputs.mode == 'apply' && inputs.migration_scope == 'standard'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration up --db-url "$SUPABASE_DB_URL"

      - name: Apply pending migrations (include-all)
        if: inputs.mode == 'apply' && inputs.migration_scope == 'include-all'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration up --db-url "$SUPABASE_DB_URL" --include-all

      - name: Migration status after apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_DB_URL: postgresql://${{ vars.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ vars.SUPABASE_DB_HOST }}:5432/postgres
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
