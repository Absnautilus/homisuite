name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspaces:
    name: Workspaces — lint + typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # modules/housekeeping publishes a real dist/ (Vite lib build); apps/web
      # resolves @homisuite/housekeeping-module against that dist/, so it must
      # exist before typecheck/test run against apps/web, not only at the end.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # These three run against the workspace/dependency graph, not any one
  # workspace's own code, so they get their own jobs rather than steps
  # bolted onto `sdk` -- a failure here means "the monorepo's shape is
  # wrong", not "a package's own tests failed", and that should be
  # immediately obvious from the job name alone.
  workspace-boundaries:
    name: Workspace boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries

  circular-dependencies:
    name: Circular dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check:circular

  dependency-dedupe:
    name: Dependency dedupe (React/Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check:dedupe

  early-access-function:
    name: Edge Function — early-access-signup (Deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run from inside the function's own directory, not the repo root:
      # Deno resolves its config file (deno.json, here disabling
      # node_modules-based resolution) by walking up from the *working
      # directory*, not from the target path -- running this from the repo
      # root would silently fall back to the outer npm workspace's
      # package.json/node_modules instead, which don't exist in this job
      # (no `npm ci` step, on purpose: this job has nothing to do with the
      # JS workspaces) and fail with a "not found in the node_modules
      # directory" error unrelated to the function's own code.
      - working-directory: supabase/functions/early-access-signup
        run: deno test --allow-env --allow-read .

  database:
    # Keep the established check name so branch-protection rules continue to
    # recognize this job after the browser coverage is added.
    name: Database — migrations + seed + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # The Supabase CLI's local stack is Docker-based. Not available in the
      # sandbox this project was developed in (see supabase/migrations'
      # comments on why src/types/database.ts was hand-written instead of
      # generated) — ubuntu-latest ships Docker preinstalled, so this job is
      # the first real, end-to-end run of what was previously only verified
      # by hand against a bare Postgres + manually installed pgTAP.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations + seed.sql
        run: supabase db reset
      - name: Run pgTAP suite
        run: supabase test db
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Housekeeping module for the web dev server
        run: npm run build --workspace=@homisuite/housekeeping-module
      - name: Read local Supabase credentials
        shell: bash
        run: |
          status_json="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status_json")"
          anon_key="$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$status_json")"
          service_role_key="$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$status_json")"
          test -n "$api_url" && test -n "$anon_key" && test -n "$service_role_key"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"
      - name: Provision local browser-test fixtures
        run: node scripts/e2e/provision-fixtures.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
