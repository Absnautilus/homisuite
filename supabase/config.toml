project_id = "hotsflow-core"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

# Every other function here relies on the platform default (verify_jwt =
# true) because every caller already has a real Supabase session -- see
# each function's own "caller" client. early-access-signup is the first
# function with no caller at all (an anonymous landing-page visitor): the
# platform gateway would otherwise reject every request with 401 before
# this function's own code -- CORS origin allowlist, honeypot, validation,
# all of it -- ever runs. This is what actually authorizes the request
# instead; see early-access-signup/index.ts's own CORS/validation comments
# for the rest of that boundary.
[functions.early-access-signup]
verify_jwt = false

# Smart Inbox: three functions are called by something other than a
# signed-in staff member, so the gateway's JWT check must be off and each
# function authenticates the request itself:
#   * oauth-callback -- the browser coming back from Microsoft sign-in;
#     trusted only through the HMAC-signed, expiring `state`.
#   * webhook -- Microsoft Graph change notifications; each one is checked
#     against the subscription's clientState (stored as a SHA-256 hash).
#   * maintenance -- the scheduler; requires the SMART_INBOX_CRON_SECRET
#     header.
# smart-inbox-connect and smart-inbox-actions keep the default (JWT
# required) and check smart_inbox.* permissions as the caller.
[functions.smart-inbox-oauth-callback]
verify_jwt = false

[functions.smart-inbox-webhook]
verify_jwt = false

[functions.smart-inbox-maintenance]
verify_jwt = false
